# Vereinswebseite auf dem Testserver: hängt sich in das Docker-Netz von HUBIplan
# (Compose-Projekt „hubiplan“, Netz „web“). Caddy von HUBIplan leitet /webseite/ hierher.
services:
  website:
    build: .
    restart: unless-stopped
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp
    # Zwischenspeicher der HUBIplan-Antworten auf der Platte: übersteht Neustarts und
    # überbrückt Ausfälle von HUBIplan beim Ausrollen (seite/api.py, STALE_IF_ERROR_SECONDS)
    environment:
      CACHE_DIR: /zwischenspeicher
    volumes:
      - zwischenspeicher:/zwischenspeicher
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Logs begrenzt (3 × 10 MB)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      web:
        aliases: [website]

volumes:
  zwischenspeicher:

networks:
  web:
    name: hubiplan_web
    external: true
