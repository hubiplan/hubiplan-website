{% load seite %}{% lokal site page.image.url as bild %}{% if abschnitt %}<section{% abschnitt "seite-text" %}>{% endif %}
{% if bild %}<figure class="titelbild"><img src="{{ bild }}"{% bildsatz site page.image "(max-width: 64rem) 100vw, 64rem" %} alt="{{ page.image.alt }}">{% if page.image.caption %}<figcaption>{{ page.image.caption }}</figcaption>{% endif %}</figure>{% endif %}
<div class="text">{{ page.text|md:site }}</div>
{% if abschnitt %}</section>{% endif %}
