{% load seite %}{# Titelbild einer Textseite (G6): schmales Bild über der Überschrift #}{% lokal site titelbild.image.url as bild %}{% if bild %}<figure class="seiten-titelbild"><img src="{{ bild }}"{% bildsatz site titelbild.image "(max-width: 64rem) 100vw, 64rem" %} alt="{{ titelbild.image.alt }}" fetchpriority="high"{% if titelbild.image.width %} width="{{ titelbild.image.width }}" height="{{ titelbild.image.height }}"{% endif %}></figure>{% endif %}
