{% load i18n %}{# Inhalt des Terminfensters als <template>: ein gemeinsames <dialog> zeigt ihn (termin.js), statt eines Fensters je Karte (UX-Audit WS-14 f) #}<template id="{{ tid }}" class="termin-inhalt">
    <h2 id="termin-fenster-titel">{{ e.title }}{% if e.is_cancelled %} <span class="marke-abgesagt">{% translate "fällt aus" %}</span>{% endif %}</h2>
    <p>{% include "seite/termin_zeit.html" with lang=True %}</p>
    {% if e.owner %}<p class="klein">{% blocktranslate with name=e.owner %}Termin von {{ name }}{% endblocktranslate %}</p>{% endif %}
    {% if e.note %}<p>{{ e.note }}</p>{% endif %}
    {% if e.location or e.address %}<p><strong>{% translate "Ort:" %}</strong> {{ e.location }}{% if e.location and e.address %}, {% endif %}{% if e.address %}<a href="https://www.openstreetmap.org/search?query={{ e.address|urlencode }}" rel="noopener">{{ e.address }}</a>{% endif %}</p>{% endif %}
    {% if e.description %}<p>{{ e.description|linebreaksbr }}</p>{% endif %}
    {% if e.programme %}<p><strong>{% translate "Programm:" %}</strong><br>{{ e.programme|linebreaksbr }}</p>{% endif %}
    {% if e.anmeldung %}{% include "seite/termin_anmeldung.html" %}{% endif %}
    {% if e.page %}<p><a href="{% url 'veranstaltung' e.page %}">{% translate "Alles zur Veranstaltung" %}</a></p>{% endif %}
    {% if e.anhaenge %}<p><strong>{% translate "Unterlagen:" %}</strong></p>
    <ul class="termin-anhaenge">{% for a in e.anhaenge %}<li><a href="{{ a.url }}" rel="noopener" target="_blank">{{ a.name }}</a><span class="nur-vorlesen"> ({% if a.kind == "pdf" %}PDF, {% endif %}{% translate "öffnet in neuem Fenster" %})</span></li>{% endfor %}</ul>{% endif %}
    <form method="dialog"><button class="knopf" type="submit">{% translate "Schließen" %}</button></form>
  </template>
