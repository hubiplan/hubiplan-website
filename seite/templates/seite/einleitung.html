{% load seite %}{% if einleitung %}{# Einleitung eines festen Bereichs aus HUBIplan (G5) #}<div class="einleitung">
{% lokal site einleitung.image.url as bild %}{% if bild %}<figure class="titelbild"><img src="{{ bild }}"{% bildsatz site einleitung.image "(max-width: 64rem) 100vw, 64rem" %} alt="{{ einleitung.image.alt }}" fetchpriority="high">{% bildunterschrift einleitung.image.caption einleitung.image %}</figure>{% endif %}
{% if einleitung.text %}<div class="text"{{ site.content_lang_attr }}>{{ einleitung.text|md:site }}</div>{% endif %}
</div>{% endif %}
