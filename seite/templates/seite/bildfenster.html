{% load i18n %}<dialog class="bild-fenster" id="bild-fenster" aria-label="{% translate 'Bild' %}">
  <img src="" alt="">
  <p class="klein bild-unterschrift"></p>
  <form method="dialog">
    <span class="bild-blaettern" hidden>
      <button type="button" class="knopf bild-zurueck">{% translate "Vorheriges Bild" %}</button>
      <span class="klein bild-zaehler" data-vorlage="{% translate 'Bild {n} von {m}' %}" aria-live="polite"></span>
      <button type="button" class="knopf bild-weiter">{% translate "Nächstes Bild" %}</button>
    </span>
    <button type="submit" class="knopf">{% translate "Schließen" %}</button>
  </form>
</dialog>
